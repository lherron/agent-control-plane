id: agent-control-plane.mobile-session-creation
kind: invariant
status: active
owner_project: agent-control-plane
scope: ACP-owned POST /v1/mobile/sessions wire contract and client mutation fence
predicate: >
  POST /v1/mobile/sessions is the sole ACP mobile creation door and preserves one
  request id and byte-equivalent logical body across uncertain retries. It asks
  the authoritative HRC home for the closed first_turn materialization mode;
  idempotency ownership remains at that home. Successful creation carries the
  claimed identifiers, status, replayed disposition, and nullable runtimeId;
  awaiting_first_turn is success and legacy started responses remain accepted.
  Every HRC domain failure is projected as one bounded flat mobile error with
  requestId, stable code and reason, retryable action hint, attemptState, and
  known claimed identifiers. During migration clients also decode the nested
  ACP error envelope, and behavior never parses English. Retryable is never
  evidence of non-mutation. Automatic client-fence retirement is permitted only
  by explicit not_claimed state or the closed legacy refusal set
  session_roster_exhausted, session_scope_occupied, roster_claim_superseded, and
  idempotency_key_conflict. Claimed_not_started, started, unknown, and legacy
  runtime_unavailable without attempt state preserve the exact request fence and
  expose same-request retry or warned start-over. Persisted submitted attempts
  reconcile once with the exact body; unresolved attempts become explicit
  uncertain state rather than an unexplained durable lock.
