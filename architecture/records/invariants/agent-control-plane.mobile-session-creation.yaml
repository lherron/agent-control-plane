id: agent-control-plane.mobile-session-creation
kind: invariant
status: active
owner_project: agent-control-plane
scope: ACP-owned POST /v1/mobile/sessions wire contract and client mutation fence
predicate: >
  POST /v1/mobile/sessions is the sole ACP mobile creation door and preserves one
  request id and byte-equivalent logical body across uncertain retries. It asks
  the authoritative HRC home for the closed first_turn materialization mode;
  idempotency ownership remains at that home. Successful creation carries the
  claimed identifiers, status, replayed disposition, and nullable runtimeId;
  awaiting_first_turn is success and legacy started responses remain accepted.
  Before any HRC claim or start request, ACP obtains the runtime-intent harness
  and execution only from HRC declaration resolution at ACP's resolved placement
  with ACP's agent sources, and keeps base scope, placement, request identity,
  conflict policy and viewer choice as its own; there is no in-process
  declaration interpretation and no fallback. A declaration-resolution rejection
  sends no claim or start request and is the one bounded exception to the flat
  error law below: it is returned in the nested ACP error envelope at the HRC
  domain status with the HRC code and detail unchanged plus stage declaration,
  attemptState not_claimed and requestId, for runtime_unavailable 503,
  declaration_invalid 422, unsupported_capability 422 and malformed_request 400
  with detail code configured_context_mismatch. attemptState not_claimed is
  asserted only on that branch and never on a claim or start failure, a missing
  response or any uncertain result. Every HRC claim or start failure is
  projected as one bounded flat mobile error with requestId, stable code and
  reason, retryable action hint, attemptState, and known claimed identifiers.
  During migration clients also decode the nested ACP error envelope, and
  behavior never parses English. Retryable is never evidence of non-mutation.
  Automatic client-fence retirement is permitted only by explicit not_claimed
  state or the closed legacy refusal set session_roster_exhausted,
  session_scope_occupied, roster_claim_superseded, and idempotency_key_conflict.
  Claimed_not_started, started, unknown, and legacy runtime_unavailable without
  attempt state preserve the exact request fence and expose same-request retry
  or warned start-over. Persisted submitted attempts reconcile once with the
  exact body; unresolved attempts become explicit uncertain state rather than an
  unexplained durable lock.
