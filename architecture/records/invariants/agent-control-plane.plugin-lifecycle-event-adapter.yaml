id: agent-control-plane.plugin-lifecycle-event-adapter
kind: invariant
status: active
owner_project: agent-control-plane
scope: configured-facade adapter from HRC lifecycle observation to HRCMac plugins
predicate: >
  ACP exclusively owns opaque plugin-event cursors binding HRC ledger
  incarnation and sequence, resolves every subscription against current HRC
  authority, and opens the typed bounded HRC stream with both asserted values.
  It forwards the canonical event envelope and ordered gaps without treating
  advisory ready as progress, maps pre-admission or live ledger replacement to
  cursor_invalid, and never resumes a sequence across incarnations. The adapter
  holds at most one decoded record outside the typed client buffer, stops pulling
  at its fixed WebSocket buffered-byte ceiling, and closes a slow consumer
  without an application replay array. It uses the configured ACP facade and
  existing transport/authentication policy with no route-specific capability,
  permission, consent, redaction, or loopback gate, and it does not reuse the
  mobile event-pump or diagnostics sender.
authority: daedalus@hrc-ios:primary architecture ruling, 2026-08-23
source:
  - hrcchat#20461
  - hrcchat#20458
  - packages/acp-server/src/deps.ts
  - packages/gateway-ios/src/event-pump.ts
  - packages/gateway-ios/src/diagnostics-ws.ts
required_tests:
  - just architecture-records
  - opaque cursor resolution and incarnation/future-position fences
  - disconnect-after-ready resume gate
  - pre-admission and live ledger replacement gates
  - one-decoded-record, WebSocket byte ceiling, and 1013 slow-consumer gates
last_verified: 2026-08-23 design approval; implementation gates pending
reopen_when: Cursor authority, HRC adapter method, canonical event mapping, replacement handling, WebSocket bound, facade transport policy, or plugin trust model changes.
supersedes: []
superseded_by: []
