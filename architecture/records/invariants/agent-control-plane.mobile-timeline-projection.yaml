required_tests:
  - just architecture-records
  - bounded first-snapshot, catch-up-or-reset, byte ceiling, oversize, epoch, replay, restart, gap, and ordinal-exhaustion gates
  - exact cursor, producer replacement, snapshot/live seam, multi-page wrkq catch-up, non-contiguous frame, prefix, and mutable-overlay gates
  - symmetric lost-head, raw-frontier progress, zero-atom origin, v1 retirement, and cursor-plus-limit receipt replay gates
  - T-07724 production-wire ordering E2E and T-07725 installed-client re-entry E2E
last_verified: 2026-08-30 T-07728 source-frontier/cursor-v2/page-receipt implementation; T-07724 production-wire gate green with zero oracle findings and promoted into the default test path; T-07725 installed-client gate pending
reopen_when:
  - mobile projection or public history-cursor authority moves away from ACP
  - producer identity, incarnation fencing, source-order preservation, atom identity, ordinal immutability, or epoch replacement semantics change
  - snapshot, reconciliation, page, encoded-byte, or oversize admission bounds change
  - epoch origin, reverse-frontier, cursor-version, or history-page receipt identity or retention semantics change
  - mutable wrkq obligation or envelope state enters durable atom identity, content, ordering, or cursor progress
  - clients flatten non-contiguous logical-frame atoms, infer prefix completeness from adjacency, or apply state across projection epochs
