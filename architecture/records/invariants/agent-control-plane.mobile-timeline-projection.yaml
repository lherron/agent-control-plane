id: agent-control-plane.mobile-timeline-projection
kind: invariant
status: active
owner_project: agent-control-plane
scope: local mobile session timeline projection, history cursors, WebSocket snapshot/live seam, and client epoch contract
predicate: >
  ACP is the sole mobile timeline projector. For one exact sessionRef,
  hostSessionId, generation, HRC-ledger incarnation, and wrkq-ledger
  incarnation, it persists one rebuildable projection epoch of presentation
  atoms keyed by canonical source identity. Each atom carries immutable
  projected content, logical-frame grouping metadata, append-or-replace
  operation, source position, and an immutable signed timeline ordinal.
  Mutable wrkq obligation and envelope state are excluded from the atom and
  from cursor progress; any such UI state is a separately refreshed overlay.
  Admission is serialized and transactional per exact session. Every epoch
  persists an immutable origin timeline boundary at ordinal zero independently
  of atom existence. A first closed newest cohort and forward atoms occupy
  ordinals at or above the origin, while closed older cohorts prepend at
  negative ordinals. Live and bounded forward catch-up preserve each producer's
  sequence and append in durable ACP admission order.
  Each epoch also persists exclusive per-source reverse frontiers separately
  from admitted-atom positions and newest high-waters. A frontier starts at one
  above the captured producer head when the cohort consumed no row (one for an
  empty head), otherwise at the lowest raw row consumed; older scans advance it
  to the lowest raw row examined even when rows project away, deduplicate, or
  are suppressed. Live and forward admission cannot advance a reverse frontier,
  and exhaustion is inferred only from producer older-availability plus full
  raw-row consumption.
  Source timestamps never reorder admitted atoms, and replay, reconnect, page
  repetition, or buffered live delivery cannot renumber an admitted source
  identity. Numeric exhaustion and a non-contiguous admitted-source range fail
  through an explicit projection reset.
  Every open captures both producer heads and incarnations and stages
  reconciliation under hard ceilings of 2,048 raw records or projected atoms
  and 16 MiB of encoded/projected work. Complete catch-up commits at the live
  end. Catch-up that cannot reach both captured heads within either ceiling
  commits nothing, retires the old epoch, and builds one bounded closed newest
  epoch at the captured vector. A single oversize atom fails without cursor
  advance. The same ceilings govern first snapshots and older-page admission.
  ACP-owned canonical history cursor v2 binds its type and version, exact
  session identity, both producer incarnations, projection epoch and origin,
  an exclusive timeline coordinate naming either the origin or a committed
  atom boundary, and the exclusive reverse frontiers plus producer high-waters.
  Legacy v1 epochs retire rather than being reinterpreted. Malformed encoding
  is 400; wrong type, future position, fence mismatch, retired epoch, or
  replaced producer incarnation is 409 cursor_invalid with no atoms. Snapshot
  construction buffers source arrivals beyond its captured vector, emits one
  newest bounded snapshot, and then admits each later source identity once.
  Reset state replaces rather than merges epochs; no cursor, connection, or
  client store may apply atoms across an epoch boundary. A bounded older scan
  may return no atoms while advancing its source vector. Before first return,
  ACP transactionally persists a page receipt keyed by projection epoch,
  canonical request-cursor digest, normalized requested limit, and response
  contract version. Exact-tuple replay returns that receipt without a producer
  read or progress mutation, never returns more atoms than its recorded limit,
  and active receipts retire only with their epoch.
  Clients union by atom id and order by timeline ordinal. Logical frame id is
  grouping metadata only: adjacent append atoms may coalesce, non-adjacent
  same-frame atoms remain at their own ordinals, and replace atoms suppress
  older replace presentation without moving unrelated atoms. Prefix
  completeness is unknown until an authoritative start atom or source
  exhaustion. Historical prepend preserves atom anchors and follow state;
  initial and explicit reset snapshots bottom once.
authority:
  repo: agent-control-plane
  surface: /v1/mobile/history, the mobile timeline WebSocket projector, and the ACP-to-HRCMac/iOS timeline contract
