# Post-push verify (T-11909, after T-10161). `just verify` runs here after a
# push to main, not in a git hook. The runner is a self-hosted launchd service
# on mini. A failure becomes a failed check.run {repo: <repo>-postpush,
# recipe: verify} node.
name: post-push-verify

on:
  push:
    branches: [main]

# Only the newest pushed head runs; a newer push cancels the older run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS, praesidium-verify]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      REPO: ${{ github.event.repository.name }}
      SHA: ${{ github.sha }}
      BEFORE: ${{ github.event.before }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The checkout is a linked worktree of mini's canonical clone, so wrkp
      # resolves it to the registered project while its directory name keys
      # check.run as <repo>-postpush. It persists between runs, so build caches survive.
      CANON: /Users/lherron/praesidium/${{ github.event.repository.name }}
      WORKTREE: /Users/lherron/praesidium/var/postpush/${{ github.event.repository.name }}-postpush
      LOCK: /Users/lherron/praesidium/var/state/postpush/verify.lock
    steps:
      - name: Check out the pushed head
        run: |
          git -C "$CANON" fetch --quiet origin
          [ -d "$WORKTREE" ] || git -C "$CANON" worktree add --detach "$WORKTREE" "$SHA"
          cd "$WORKTREE"
          git checkout --quiet --detach --force "$SHA"
          git clean -fdq
          echo "verifying $REPO ${BEFORE:0:12}..${SHA:0:12} in $WORKTREE"

      # On a developer host the praesidium workspace root provides the deps.
      # The runner's worktree stands alone, so it installs them from the
      # frozen lockfile. node_modules is ignored, so it survives `git clean`,
      # and bun never prunes a nested copy an older lock left behind; each run
      # starts from an empty tree (Bun's global cache keeps this to seconds).
      - name: Install dependencies
        working-directory: ${{ env.WORKTREE }}
        run: |
          rm -rf node_modules packages/*/node_modules
          LEFTHOOK=0 bun install --frozen-lockfile

      # dev-env reuses a running ephemeral acp-server, which would serve an
      # earlier push's code if a cancelled run left it behind. Each post-push
      # verify starts from a fresh environment.
      - name: Tear down the previous dev environment
        working-directory: ${{ env.WORKTREE }}
        run: just env-down

      # One verify at a time on mini (it hosts the canonical wrkq DB). A job
      # waits for the machine-wide lock; it never skips. Verify runs in its own
      # session: when a newer push cancels this run, the supervisor SIGKILLs that
      # session before wrkp can post, so a superseded run never reads as red.
      # Keep the 45-minute wall limit. After lock acquisition, capture diagnostics
      # at 8 minutes without output and terminate at 10 minutes. Evidence persists
      # outside the checkout and is also printed to the Actions log.
      - name: Verify
        working-directory: ${{ env.WORKTREE }}
        run: |
          python3 scripts/post-push-watchdog.py \
            --lock "$LOCK" \
            --artifacts "/Users/lherron/praesidium/var/postpush-artifacts/$REPO/${{ github.run_id }}-${{ github.run_attempt }}" \
            -- nice -n 10 wrkp just verify &
          supervisor=$!
          trap 'kill -TERM "$supervisor" 2>/dev/null || true; wait "$supervisor" 2>/dev/null || true; exit 1' INT TERM
          rc=0; wait "$supervisor" || rc=$?
          exit "$rc"

      - name: Record the run
        if: always()
        working-directory: ${{ env.WORKTREE }}
        env:
          STATUS: ${{ job.status }}
        run: |
          wrkp post "$REPO" --type verify.postpush \
            --key "verify.postpush:${{ github.run_id }}:${{ github.run_attempt }}" \
            -m "post-push verify $STATUS at ${SHA:0:12}" \
            --attr source=github-actions --attr node=mini \
            --attr repo="$REPO-postpush" --attr status="$STATUS" \
            --attr sha="$SHA" --attr before="$BEFORE" --attr range="$BEFORE..$SHA" \
            --attr pusher="${{ github.actor }}" --attr run_url="$RUN_URL" || true
